name: Build and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run type-check

      - name: Build site
        run: npm run build-only

      - name: Package site and checksum
        run: |
          tar -cJf kanna_connection_webui.tar.xz dist
          sha256sum kanna_connection_webui.tar.xz > kanna_connection_webui.tar.xz.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kanna_connection_webui-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            kanna_connection_webui.tar.xz
            kanna_connection_webui.tar.xz.sha256
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: kanna_connection_webui-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" kanna_connection_webui.tar.xz kanna_connection_webui.tar.xz.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" kanna_connection_webui.tar.xz kanna_connection_webui.tar.xz.sha256 --draft --generate-notes --verify-tag --title "$GITHUB_REF_NAME"
          fi
